name: CI

on:
  push:
    branches: [testing, public]
  pull_request:
    branches: [testing, public]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commercialbrainz
          POSTGRES_PASSWORD: commercialbrainz
          POSTGRES_DB: commercialbrainz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql://commercialbrainz:commercialbrainz@localhost:5432/commercialbrainz
          DATABASE_URL: postgresql+asyncpg://commercialbrainz:commercialbrainz@localhost:5432/commercialbrainz
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
        run: alembic upgrade head

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://commercialbrainz:commercialbrainz@localhost:5432/commercialbrainz
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
        run: |
          pytest -v \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f reports/coverage.xml ]]; then
            {
              echo "## Backend coverage"
              echo '```'
              python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("reports/coverage.xml").getroot()
          rate = float(root.attrib.get("line-rate", 0)) * 100
          lines = int(root.attrib.get("lines-valid", 0))
          covered = int(root.attrib.get("lines-covered", 0))
          print(f"Line coverage: {rate:.1f}% ({covered}/{lines})")
          PY
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/reports/junit.xml
            backend/reports/coverage.xml
            backend/reports/htmlcov
          if-no-files-found: ignore

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: |
          mkdir -p reports
          npm test -- \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=reports/junit.xml

      - name: Typecheck and build
        run: npm run build

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: frontend/reports/junit.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/public')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker tags cannot contain "/" (PR refs are like "95/merge").
      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          OWNER="${IMAGE_OWNER,,}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            EXTRA="pr-${{ github.event.number }}"
            write_tags() {
              local name="$1"
              printf '%s\n' \
                "ghcr.io/${OWNER}/${name}:${SHA}" \
                "ghcr.io/${OWNER}/${name}:${EXTRA}"
            }
          else
            EXTRA="${GITHUB_REF_NAME//\//-}"
            write_tags() {
              local name="$1"
              printf '%s\n' \
                "ghcr.io/${OWNER}/${name}:${SHA}" \
                "ghcr.io/${OWNER}/${name}:${EXTRA}" \
                "ghcr.io/${OWNER}/${name}:latest"
            }
          fi
          {
            echo "api<<EOF"
            write_tags commercialbrainz-api
            echo "EOF"
            echo "web<<EOF"
            write_tags commercialbrainz-web
            echo "EOF"
            echo "maintenance<<EOF"
            write_tags commercialbrainz-maintenance
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tags (extra=${EXTRA})"
          write_tags commercialbrainz-api

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.api
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/public') }}
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.web
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/public') }}
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push maintenance image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.maintenance
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/public') }}
          tags: ${{ steps.tags.outputs.maintenance }}
          cache-from: type=gha,scope=maintenance
          cache-to: type=gha,mode=max,scope=maintenance

      - name: Make GHCR packages public (anonymous VM pulls)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/public')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          for pkg in commercialbrainz-api commercialbrainz-web commercialbrainz-maintenance; do
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${pkg}/visibility" \
              -f visibility=public \
              || gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/users/${OWNER}/packages/container/${pkg}/visibility" \
              -f visibility=public; then
              echo "public: $pkg"
            else
              echo "WARN: could not set $pkg public via API (check GitHub Packages UI if VM pulls 401)"
            fi
          done
