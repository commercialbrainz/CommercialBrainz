# VM override: Caddy TLS on 80/443 → forward_auth(maintenance) → api/web
# All app services must restart after host reboot (Docker starts on boot).
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped

  api:
    ports: !reset []
    restart: unless-stopped

  worker:
    restart: unless-stopped

  maintenance:
    image: ghcr.io/${GHCR_OWNER:-commercialbrainz}/commercialbrainz-maintenance:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.maintenance
    restart: unless-stopped
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "8080"
      FLAGS_DIR: /var/maintenance/flags
      STATUS_URL: http://api:8000/api/v1/site-status
      POLL_INTERVAL_SEC: "15"
    volumes:
      - ../data/maintenance:/var/maintenance/flags
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/_maintenance/alive",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA (optional; used when CADDY_TLS_MODE=origin)
      - ../data/caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      maintenance:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
